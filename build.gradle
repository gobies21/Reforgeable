plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.116'
}



version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com/"
    }
}

dependencies {

    implementation "curse.maven:apothecary-potion-expansion-1278100:8591720"
    implementation "curse.maven:curios-309927:6529130"
    implementation("curse.maven:jei-238222:7391682")

    runtimeOnly("curse.maven:nameless-trinkets-541466:8195531")
    runtimeOnly("curse.maven:spark-361579:6225208")
    runtimeOnly("curse.maven:crafttweaker-239197:7772819")
    runtimeOnly("curse.maven:simply-potion-rings-1217574:8472116")

    implementation "curse.maven:irons-spells-n-spellbooks-855414:8202148"
    implementation "curse.maven:irons-lib-1492763:7907336"
    implementation "curse.maven:geckolib-388172:7707149"
    implementation "curse.maven:playeranimator-658587:7389814"

